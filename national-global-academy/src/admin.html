<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin panel | National Global Academy</title><link rel="stylesheet" href="/assets/styles.css"><style>body{background:#eef1f2}.admin{max-width:1100px;margin:4vh auto;padding:24px;background:white;border-top:4px solid #c9a227;box-shadow:0 8px 35px #0b1d3315}.admin label{display:grid;gap:6px;margin:12px 0}.admin input,.admin textarea,.admin select{padding:10px;border:1px solid #ccd6db;width:100%;min-width:0}.admin textarea{font:12px monospace;min-height:260px}.admin p{line-height:1.6}.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.admin-stat{padding:18px;background:#f5f5f2}.admin nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.admin nav button{padding:9px;cursor:pointer}.admin table{border-collapse:collapse;width:100%;min-width:800px;font-size:13px}.admin td,.admin th{text-align:left;border-bottom:1px solid #ddd;padding:10px;vertical-align:top}.overflow{overflow:auto}.admin small{color:#5a6b75}.admin button:disabled{opacity:.5}.admin-message{min-height:1.5em}</style></head><body><main class="admin"><span class="eyebrow">National Global Academy</span><h1>Admin panel</h1><p class="admin-message" role="status"></p><section id="login"><p id="setup">Checking staff access.</p><form id="login-form"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="btn btn-navy">Sign in</button></form></section><section id="dashboard" hidden><div class="admin-grid" id="stats"></div><nav aria-label="Admin sections"><button data-tab="enquiries">Enquiries</button><button data-tab="courses">Courses</button><button data-tab="batch">Batches</button><button data-tab="settings">Settings</button><button data-tab="content">Page data</button><button id="logout">Sign out</button></nav><section id="panel"></section></section></main><script src="/assets/admin.js" defer></script></body></html>
